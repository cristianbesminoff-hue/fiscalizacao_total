<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Painel do Técnico - Execução de Ordem</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #f4f6f9;
            margin: 0;
            padding: 15px;
            color: #333;
        }
        .container {
            max-width: 600px;
            margin: 0 auto;
            background: #fff;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
            box-sizing: border-box;
        }
        h2 { font-size: 20px; margin-top: 0; color: #1a365d; text-align: center; }
        
        .info-card {
            background: #f8fafc;
            border: 1px solid #e2e8f0;
            padding: 15px;
            border-radius: 6px;
            margin-bottom: 15px;
        }
        .info-label {
            font-size: 12px;
            color: #718096;
            text-transform: uppercase;
            font-weight: bold;
            margin-bottom: 3px;
        }
        .info-value {
            font-size: 16px;
            color: #2d3748;
            font-weight: bold;
            margin-bottom: 12px;
            word-break: break-word;
        }
        .endereco-destaque {
            background: #ebf8ff;
            border-left: 4px solid #3182ce;
            padding: 10px;
            margin-top: 5px;
            margin-bottom: 15px;
            border-radius: 0 4px 4px 0;
        }
        .endereco-destaque .info-value {
            color: #2b6cb0;
            margin-bottom: 0;
            font-size: 15px;
        }

        .btn-navegar {
            display: block;
            width: 100%;
            padding: 14px;
            background-color: #3182ce;
            color: white;
            text-align: center;
            text-decoration: none;
            font-weight: bold;
            font-size: 16px;
            border-radius: 6px;
            box-sizing: border-box;
            margin-bottom: 12px;
            box-shadow: 0 2px 4px rgba(49, 130, 206, 0.3);
        }
        .btn-navegar:hover { background-color: #2b6cb0; }

        .btn-concluir {
            display: block;
            width: 100%;
            padding: 14px;
            background-color: #48bb78;
            color: white;
            border: none;
            text-align: center;
            font-weight: bold;
            font-size: 16px;
            border-radius: 6px;
            cursor: pointer;
            box-sizing: border-box;
            margin-bottom: 12px;
        }
        .btn-concluir:hover { background-color: #38a169; }

        .btn-nao-concluido {
            display: block;
            width: 100%;
            padding: 14px;
            background-color: #e53e3e;
            color: white;
            border: none;
            text-align: center;
            font-weight: bold;
            font-size: 16px;
            border-radius: 6px;
            cursor: pointer;
            box-sizing: border-box;
            margin-bottom: 12px;
        }
        .btn-nao-concluido:hover { background-color: #c53030; }

        .btn-voltar {
            display: block;
            width: 100%;
            padding: 12px;
            background-color: #4a5568;
            color: white;
            text-align: center;
            text-decoration: none;
            font-weight: bold;
            font-size: 14px;
            border-radius: 6px;
            box-sizing: border-box;
        }
        .btn-voltar:hover { background-color: #2d3748; }
    </style>
</head>
<body>

<div class="container">
    <h2>Painel de Atendimento</h2>

    <div class="info-card">
        <div class="info-label">Técnico Fiscal / Responsável</div>
        <div class="info-value" id="valTecnico">Carregando...</div>

        <!-- Endereço posicionado logo abaixo do nome do técnico fiscal -->
        <div class="endereco-destaque">
            <div class="info-label">Endereço de Destino</div>
            <div class="info-value" id="campoEndereco">Carregando endereço...</div>
        </div>

        <div class="info-label">Cliente / Assinante</div>
        <div class="info-value" id="valCliente">Carregando...</div>

        <div class="info-label">Protocolo / Ordem de Serviço</div>
        <div class="info-value" id="valProtocolo">Carregando...</div>
    </div>

    <!-- Botão de Navegação Waze usando o Endereço -->
    <a href="#" id="btnAbrirGps" class="btn-navegar" target="_blank">🚗 Abrir Navegação no Waze</a>

    <button class="btn-concluir" onclick="marcarStatus('concluido')">✅ Marcar como Concluído</button>
    <button class="btn-nao-concluido" onclick="marcarStatus('nao-concluido')">❌ Marcar como Não Concluído</button>

    <a href="index.html" class="btn-voltar">⬅️ Voltar para a Rota</a>
</div>

<script>
    let dadosAtuais = null;

    document.addEventListener("DOMContentLoaded", () => {
        const dadosStr = localStorage.getItem('protocoloEmAtendimento');
        
        if (dadosStr) {
            try {
                dadosAtuais = JSON.parse(dadosStr);
                
                // Preenche os campos na tela
                document.getElementById('valTecnico').innerText = dadosAtuais.tecnico || "Não informado";
                document.getElementById('campoEndereco').innerText = dadosAtuais.endereco || "Endereço não informado";
                document.getElementById('valCliente').innerText = dadosAtuais.cliente || "Não especificado";
                document.getElementById('valProtocolo').innerText = dadosAtuais.protocolo || "N/A";

                // Configura o link do Waze usando prioridade para o Endereço de texto (ou coordenadas como fallback)
                const btnGps = document.getElementById('btnAbrirGps');
                if (dadosAtuais.endereco && dadosAtuais.endereco !== "Endereço não informado") {
                    let enderecoCodificado = encodeURIComponent(dadosAtuais.endereco);
                    btnGps.href = `https://www.waze.com/ul?q=${enderecoCodificado}&navigate=yes`;
                } else if (dadosAtuais.lat && dadosAtuais.lon) {
                    btnGps.href = `https://www.waze.com/ul?ll=${dadosAtuais.lat},${dadosAtuais.lon}&navigate=yes`;
                } else {
                    btnGps.style.display = 'none';
                }

            } catch (e) {
                console.error("Erro ao ler os dados do atendimento:", e);
                alert("Erro ao carregar dados do atendimento.");
            }
        } else {
            alert("Nenhum atendimento selecionado.");
            window.location.href = 'index.html';
        }
    });

    function marcarStatus(novoStatus) {
        if (!dadosAtuais) return;

        // Atualiza na lista principal salva no localStorage
        const salvoLocal = localStorage.getItem('linhasProcessadasCompletasLeaflet');
        if (salvoLocal) {
            try {
                let lista = JSON.parse(salvoLocal);
                if (lista[dadosAtuais.indice]) {
                    lista[dadosAtuais.indice].status = novoStatus;
                    localStorage.setItem('linhasProcessadasCompletasLeaflet', JSON.stringify(lista));
                }
            } catch (e) {
                console.error("Erro ao atualizar status global", e);
            }
        }

        alert(`Atendimento marcado como: ${novoStatus === 'concluido' ? 'Concluído' : 'Não Concluído'}`);
        window.location.href = 'index.html';
    }
</script>

</body>
</html>
