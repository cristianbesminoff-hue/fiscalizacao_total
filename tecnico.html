<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fiscalização Total - Vistoria de Campo</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { background-color: #0f172a; color: #f8fafc; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        .glass { background: rgba(30, 41, 59, 0.7); backdrop-filter: blur(12px); border: 1px solid rgba(255, 255, 255, 0.1); }
        .secao-condicional, .campo-customizado { display: none; }
    </style>
</head>
<body class="min-h-screen p-3 md:p-8 flex items-center justify-center">

    <div class="w-full max-w-3xl glass rounded-2xl shadow-2xl p-5 md:p-8">
        
        <!-- Cabeçalho -->
        <div class="flex justify-between items-center border-b border-slate-700 pb-4 mb-6">
            <div>
                <h1 class="text-xl md:text-2xl font-extrabold text-cyan-400 tracking-wider">FISCALIZAÇÃO DE PROTOCOLOS</h1>
                <p class="text-xs text-slate-400">Unifique - Padrão de Vistoria Operacional</p>
            </div>
            <div id="status-conexao" class="px-3 py-1 bg-emerald-500/20 border border-emerald-500 text-emerald-400 text-xs rounded-full font-semibold">
                Online
            </div>
        </div>

        <!-- Formulário Oficial Moderno e Dinâmico -->
        <form id="form-vistoria" onsubmit="enviarVistoria(event)" class="space-y-6 text-sm">
            
            <!-- 1. Nome do tecnico de qualidade -->
            <div class="p-4 bg-slate-900/60 rounded-xl border border-slate-800">
                <label class="block font-semibold text-slate-300 mb-2">1. Nome do técnico de qualidade:</label>
                <span id="txt-tecnico-qualidade" class="font-semibold text-cyan-300 text-base block">Identificando...</span>
            </div>

            <!-- Bloco de Endereço e Botão GPS -->
            <div class="p-4 bg-slate-900/60 rounded-xl border border-slate-800 space-y-3">
                <div>
                    <label class="block font-semibold text-slate-300 mb-1">📍 Endereço do Cliente (Extrator):</label>
                    <span id="txt-endereco-cliente" class="text-white font-medium text-xs block bg-slate-950 p-2.5 rounded-lg border border-slate-800">Carregando endereço...</span>
                </div>
                <button type="button" onclick="abrirGPS()" class="w-full py-2.5 bg-blue-600 hover:bg-blue-500 text-white text-xs font-bold rounded-xl transition shadow-lg flex items-center justify-center gap-2">
                    🗺️ Abrir Endereço no Google Maps
                </button>
            </div>

            <!-- Estado e Cidade -->
            <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                <div>
                    <label class="block font-semibold text-slate-300 mb-2">2. Estado:</label>
                    <select id="estado" required class="w-full bg-slate-900 border border-slate-700 rounded-xl p-3 text-white focus:outline-none focus:border-cyan-500">
                        <option value="">Selecione...</option>
                        <option value="SC">SC</option>
                        <option value="RS">RS</option>
                        <option value="PR">PR</option>
                    </select>
                </div>
                <div>
                    <label class="block font-semibold text-slate-300 mb-2">3. Cidade Fiscalizada:</label>
                    <input type="text" id="cidade" placeholder="Ex: Canoas, Blumenau..." required class="w-full bg-slate-900 border border-slate-700 rounded-xl p-3 text-white focus:outline-none focus:border-cyan-500">
                </div>
            </div>

            <!-- 4. Número do Protocolo (Com Validação/Edição) -->
            <div class="p-4 bg-slate-900/60 rounded-xl border border-slate-800 space-y-3">
                <div class="flex justify-between items-center">
                    <div>
                        <label class="block font-semibold text-slate-300">4. Número do Protocolo:</label>
                        <span id="txt-protocolo" class="font-bold text-white text-base">Carregando...</span>
                    </div>
                    <div class="w-48">
                        <label class="block text-[10px] text-slate-400 mb-1">Está correto?</label>
                        <select id="valida-protocolo" onchange="controlarEdicao('protocolo')" class="w-full bg-slate-900 border border-slate-700 rounded-lg p-1.5 text-xs text-white">
                            <option value="sim">Sim, está correto</option>
                            <option value="nao">Não, alterar</option>
                        </select>
                    </div>
                </div>
                <div id="box-edicao-protocolo" class="campo-customizado pt-2 border-t border-slate-700">
                    <input type="text" id="input-protocolo-custom" placeholder="Digite o número correto do protocolo" class="w-full bg-slate-900 border border-cyan-500 rounded-lg p-2 text-white text-xs focus:outline-none">
                </div>
            </div>

            <!-- Empresa & Vistoria -->
            <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                <div>
                    <label class="block font-semibold text-slate-300 mb-2">5. Empresa Fiscalizada:</label>
                    <input type="text" id="empresa" placeholder="Nome da empresa parceira" required class="w-full bg-slate-900 border border-slate-700 rounded-xl p-3 text-white focus:outline-none focus:border-cyan-500">
                </div>
                <div>
                    <label class="block font-semibold text-slate-300 mb-2">7. Vistoria:</label>
                    <select id="tipo-vistoria" required class="w-full bg-slate-900 border border-slate-700 rounded-xl p-3 text-white focus:outline-none focus:border-cyan-500">
                        <option value="">Selecione...</option>
                        <option value="FTTH">FTTH</option>
                        <option value="FTTB">FTTB</option>
                        <option value="FTTA">FTTA</option>
                        <option value="FTTX">FTTX</option>
                    </select>
                </div>
            </div>

            <!-- 6. Nome do técnico que executou o serviço (Com Validação/Edição) -->
            <div class="p-4 bg-slate-900/60 rounded-xl border border-slate-800 space-y-3">
                <div class="flex justify-between items-center">
                    <div>
                        <label class="block font-semibold text-slate-300">6. Nome do técnico que executou o serviço:</label>
                        <span id="txt-tecnico-executor" class="font-bold text-cyan-300 text-base">Carregando...</span>
                    </div>
                    <div class="w-48">
                        <label class="block text-[10px] text-slate-400 mb-1">Está correto?</label>
                        <select id="valida-executor" onchange="controlarEdicao('executor')" class="w-full bg-slate-900 border border-slate-700 rounded-lg p-1.5 text-xs text-white">
                            <option value="sim">Sim, está correto</option>
                            <option value="nao">Não, alterar</option>
                        </select>
                    </div>
                </div>
                <div id="box-edicao-executor" class="campo-customizado pt-2 border-t border-slate-700">
                    <input type="text" id="input-executor-custom" placeholder="Digite o nome correto do técnico executor" class="w-full bg-slate-900 border border-cyan-500 rounded-lg p-2 text-white text-xs focus:outline-none">
                </div>
            </div>

            <!-- 8. APR - Análise Preliminar de Risco -->
            <div>
                <label class="block font-semibold text-slate-300 mb-2">8. APR - Análise Preliminar de Risco:</label>
                <select id="apr" required class="w-full bg-slate-900 border border-slate-700 rounded-xl p-3 text-white focus:outline-none focus:border-cyan-500">
                    <option value="">Selecione...</option>
                    <option value="Trabalho em altura">Trabalho em altura</option>
                    <option value="Não ha atividade de risco">Não há atividade de risco</option>
                </select>
            </div>

            <!-- 9, 10 & 11. Organização da C.A e Fotos com Se Aplica -->
            <div class="p-4 bg-slate-900/40 rounded-xl border border-slate-800 space-y-4">
                <div class="flex flex-col md:flex-row md:items-center justify-between gap-2">
                    <label class="block font-semibold text-cyan-300">9. Organização da C.A / Caixa:</label>
                    <div class="w-full md:w-48">
                        <label class="block text-[10px] text-slate-400 mb-1">Se aplica?</label>
                        <select id="aplica-caixa" onchange="controlarSecao('caixa')" required class="w-full bg-slate-900 border border-slate-700 rounded-lg p-2 text-xs text-white">
                            <option value="">Selecione...</option>
                            <option value="Sim">Sim</option>
                            <option value="Nao">Não</option>
                        </select>
                    </div>
                </div>

                <div id="conteudo-caixa" class="secao-condicional space-y-4 pt-3 border-t border-slate-800">
                    <div>
                        <label class="block text-xs text-slate-300 mb-1">Status da Organização:</label>
                        <select id="org-ca" class="w-full bg-slate-900 border border-slate-700 rounded-xl p-3 text-white text-sm">
                            <option value="APROVADO">APROVADO</option>
                            <option value="REPROVADO">REPROVADO</option>
                        </select>
                    </div>
                    <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                        <div>
                            <label class="block text-xs text-slate-300 mb-1">10. Foto da Caixa Externa (Máx: 1 arquivo):</label>
                            <input type="file" id="foto-caixa-ext" accept="image/*,video/*,audio/*,.pdf,.doc,.docx,.xls,.xlsx,.ppt,.pptx" class="w-full text-xs text-slate-400 file:mr-2 file:py-1.5 file:px-3 file:rounded-lg file:border-0 file:bg-cyan-600 file:text-white">
                        </div>
                        <div>
                            <label class="block text-xs text-slate-300 mb-1">11. Foto da Caixa Interna (Máx: 1 arquivo):</label>
                            <input type="file" id="foto-caixa-int" accept="image/*,video/*,audio/*,.pdf,.doc,.docx,.xls,.xlsx,.ppt,.pptx" class="w-full text-xs text-slate-400 file:mr-2 file:py-1.5 file:px-3 file:rounded-lg file:border-0 file:bg-cyan-600 file:text-white">
                        </div>
                    </div>
                </div>
            </div>

            <!-- 12 & 13. Lançamento do Drop com Se Aplica -->
            <div class="p-4 bg-slate-900/40 rounded-xl border border-slate-800 space-y-4">
                <div class="flex flex-col md:flex-row md:items-center justify-between gap-2">
                    <label class="block font-semibold text-cyan-300">12. Lançamento do Drop está correto?</label>
                    <div class="w-full md:w-48">
                        <label class="block text-[10px] text-slate-400 mb-1">Se aplica?</label>
                        <select id="aplica-drop" onchange="controlarSecao('drop')" required class="w-full bg-slate-900 border border-slate-700 rounded-lg p-2 text-xs text-white">
                            <option value="">Selecione...</option>
                            <option value="Sim">Sim</option>
                            <option value="Nao">Não</option>
                        </select>
                    </div>
                </div>

                <div id="conteudo-drop" class="secao-condicional space-y-3 pt-3 border-t border-slate-800">
                    <div>
                        <label class="block text-xs text-slate-300 mb-1">Status do Lançamento:</label>
                        <select id="lanc-drop" class="w-full bg-slate-900 border border-slate-700 rounded-xl p-3 text-white text-sm">
                            <option value="APROVADO">APROVADO</option>
                            <option value="REPROVADO">REPROVADO</option>
                        </select>
                    </div>
                    <div>
                        <label class="block text-xs text-slate-300 mb-1">13. Foto Lançamento do Drop (Máx: 1 arquivo):</label>
                        <input type="file" id="foto-lanc-drop" accept="image/*,video/*,audio/*,.pdf,.doc,.docx,.xls,.xlsx,.ppt,.pptx" class="w-full text-xs text-slate-400 file:mr-2 file:py-1.5 file:px-3 file:rounded-lg file:border-0 file:bg-cyan-600 file:text-white">
                    </div>
                </div>
            </div>

            <!-- 14 & 15. Ancoragem alça roldana com Se Aplica -->
            <div class="p-4 bg-slate-900/40 rounded-xl border border-slate-800 space-y-4">
                <div class="flex flex-col md:flex-row md:items-center justify-between gap-2">
                    <label class="block font-semibold text-cyan-300">14. Ancoragem da alça pré-formada na roldana no poste celesc e poste da residencia:</label>
                    <div class="w-full md:w-48">
                        <label class="block text-[10px] text-slate-400 mb-1">Se aplica?</label>
                        <select id="aplica-roldana" onchange="controlarSecao('roldana')" required class="w-full bg-slate-900 border border-slate-700 rounded-lg p-2 text-xs text-white">
                            <option value="">Selecione...</option>
                            <option value="Sim">Sim</option>
                            <option value="Nao">Não</option>
                        </select>
                    </div>
                </div>

                <div id="conteudo-roldana" class="secao-condicional space-y-3 pt-3 border-t border-slate-800">
                    <div>
                        <label class="block text-xs text-slate-300 mb-1">Status da Ancoragem:</label>
                        <select id="ancoragem-roldana" class="w-full bg-slate-900 border border-slate-700 rounded-xl p-3 text-white text-sm">
                            <option value="APROVADO">APROVADO</option>
                            <option value="REPROVADO">REPROVADO</option>
                            <option value="N/A (FTTA)">N/A (FTTA)</option>
                        </select>
                    </div>
                    <div>
                        <label class="block text-xs text-slate-300 mb-1">15. Foto da ancoragem na roldana (Até 5 arquivos):</label>
                        <input type="file" id="foto-ancoragem-roldana" multiple accept="image/*,video/*,audio/*,.pdf,.doc,.docx,.xls,.xlsx,.ppt,.pptx" class="w-full text-xs text-slate-400 file:mr-2 file:py-1.5 file:px-3 file:rounded-lg file:border-0 file:bg-cyan-600 file:text-white">
                    </div>
                </div>
            </div>

            <!-- 16 & 17. Ancoragem do cabo no pimentão com Se Aplica -->
            <div class="p-4 bg-slate-900/40 rounded-xl border border-slate-800 space-y-4">
                <div class="flex flex-col md:flex-row md:items-center justify-between gap-2">
                    <label class="block font-semibold text-cyan-300">16. Ancoragem do cabo no pimentão (residencia):</label>
                    <div class="w-full md:w-48">
                        <label class="block text-[10px] text-slate-400 mb-1">Se aplica?</label>
                        <select id="aplica-pimentao" onchange="controlarSecao('pimentao')" required class="w-full bg-slate-900 border border-slate-700 rounded-lg p-2 text-xs text-white">
                            <option value="">Selecione...</option>
                            <option value="Sim">Sim</option>
                            <option value="Nao">Não</option>
                        </select>
                    </div>
                </div>

                <div id="conteudo-pimentao" class="secao-condicional space-y-3 pt-3 border-t border-slate-800">
                    <div>
                        <label class="block text-xs text-slate-300 mb-1">Status da Ancoragem:</label>
                        <select id="ancoragem-pimentao" class="w-full bg-slate-900 border border-slate-700 rounded-xl p-3 text-white text-sm">
                            <option value="APROVADO">APROVADO</option>
                            <option value="REPROVADO">REPROVADO</option>
                            <option value="N/A (FTTA)">N/A (FTTA)</option>
                        </select>
                    </div>
                    <div>
                        <label class="block text-xs text-slate-300 mb-1">17. Foto da ancoragem no pimentão (Máx: 1 arquivo):</label>
                        <input type="file" id="foto-ancoragem-pimentao" accept="image/*,video/*,audio/*,.pdf,.doc,.docx,.xls,.xlsx,.ppt,.pptx" class="w-full text-xs text-slate-400 file:mr-2 file:py-1.5 file:px-3 file:rounded-lg file:border-0 file:bg-cyan-600 file:text-white">
                    </div>
                </div>
            </div>

            <!-- 18 & 19. Acabamento do Drop com Se Aplica -->
            <div class="p-4 bg-slate-900/40 rounded-xl border border-slate-800 space-y-4">
                <div class="flex flex-col md:flex-row md:items-center justify-between gap-2">
                    <label class="block font-semibold text-cyan-300">18. Acabamento do Drop (placa de identificação, espiral caixa):</label>
                    <div class="w-full md:w-48">
                        <label class="block text-[10px] text-slate-400 mb-1">Se aplica?</label>
                        <select id="aplica-acabamento" onchange="controlarSecao('acabamento')" required class="w-full bg-slate-900 border border-slate-700 rounded-lg p-2 text-xs text-white">
                            <option value="">Selecione...</option>
                            <option value="Sim">Sim</option>
                            <option value="Nao">Não</option>
                        </select>
                    </div>
                </div>

                <div id="conteudo-acabamento" class="secao-condicional space-y-3 pt-3 border-t border-slate-800">
                    <div>
                        <label class="block text-xs text-slate-300 mb-1">Status do Acabamento:</label>
                        <select id="acabamento-drop" class="w-full bg-slate-900 border border-slate-700 rounded-xl p-3 text-white text-sm">
                            <option value="APROVADO">APROVADO</option>
                            <option value="REPROVADO">REPROVADO</option>
                        </select>
                    </div>
                    <div>
                        <label class="block text-xs text-slate-300 mb-1">19. Foto do acabamento do Drop (Até 5 arquivos):</label>
                        <input type="file" id="foto-acabamento-drop" multiple accept="image/*,video/*,audio/*,.pdf,.doc,.docx,.xls,.xlsx,.ppt,.pptx" class="w-full text-xs text-slate-400 file:mr-2 file:py-1.5 file:px-3 file:rounded-lg file:border-0 file:bg-cyan-600 file:text-white">
                    </div>
                </div>
            </div>

            <!-- 20 & 21. Organização do DG com Se Aplica -->
            <div class="p-4 bg-slate-900/40 rounded-xl border border-slate-800 space-y-4">
                <div class="flex flex-col md:flex-row md:items-center justify-between gap-2">
                    <label class="block font-semibold text-cyan-300">20. Organização do DG:</label>
                    <div class="w-full md:w-48">
                        <label class="block text-[10px] text-slate-400 mb-1">Se aplica?</label>
                        <select id="aplica-dg" onchange="controlarSecao('dg')" required class="w-full bg-slate-900 border border-slate-700 rounded-lg p-2 text-xs text-white">
                            <option value="">Selecione...</option>
                            <option value="Sim">Sim</option>
                            <option value="Nao">Não</option>
                        </select>
                    </div>
                </div>

                <div id="conteudo-dg" class="secao-condicional space-y-3 pt-3 border-t border-slate-800">
                    <div>
                        <label class="block text-xs text-slate-300 mb-1">Status do DG:</label>
                        <select id="organizacao-dg" class="w-full bg-slate-900 border border-slate-700 rounded-xl p-3 text-white text-sm">
                            <option value="APROVADO">APROVADO</option>
                            <option value="REPROVADO">REPROVADO</option>
                            <option value="N/A">N/A</option>
                        </select>
                    </div>
                    <div>
                        <label class="block text-xs text-slate-300 mb-1">21. Foto da organização do DG (Máx: 1 arquivo):</label>
                        <input type="file" id="foto-organizacao-dg" accept="image/*,video/*,audio/*,.pdf,.doc,.docx,.xls,.xlsx,.ppt,.pptx" class="w-full text-xs text-slate-400 file:mr-2 file:py-1.5 file:px-3 file:rounded-lg file:border-0 file:bg-cyan-600 file:text-white">
                    </div>
                </div>
            </div>

            <!-- 22. Situação Final -->
            <div>
                <label class="block font-semibold text-slate-300 mb-2">22. Situação final da vistoria:</label>
                <div class="grid grid-cols-2 gap-4">
                    <label class="cursor-pointer border border-emerald-500/50 bg-emerald-500/10 hover:bg-emerald-500/20 p-3 rounded-xl flex items-center justify-center gap-2 transition">
                        <input type="radio" name="status" value="APROVADO" required class="accent-emerald-500">
                        <span class="font-bold text-emerald-400">🟢 APROVADO</span>
                    </label>
                    <label class="cursor-pointer border border-rose-500/50 bg-rose-500/10 hover:bg-rose-500/20 p-3 rounded-xl flex items-center justify-center gap-2 transition">
                        <input type="radio" name="status" value="PENDENCIA-REFAZER" required class="accent-rose-500">
                        <span class="font-bold text-rose-400">🔴 PENDENCIA-REFAZER</span>
                    </label>
                </div>
            </div>

            <!-- 23. Observações Finais -->
            <div>
                <label class="block font-semibold text-slate-300 mb-2">23. Observações finais. caso pendencia, descreva os motivos identificados!</label>
                <textarea id="observacoes" rows="3" placeholder="Descreva detalhadamente os motivos identificados em caso de pendência..." class="w-full bg-slate-900 border border-slate-700 rounded-xl p-3 text-white focus:outline-none focus:border-cyan-500 text-sm"></textarea>
            </div>

            <!-- Botão Enviar -->
            <button type="submit" id="btn-enviar" class="w-full py-4 bg-gradient-to-r from-cyan-600 to-blue-600 hover:from-cyan-500 hover:to-blue-500 text-white font-bold rounded-xl shadow-lg transition transform active:scale-95">
                Salvar Fiscalização e Limpar Fila
            </button>
        </form>

    </div>

    <!-- Script de Controle, Base64, GPS e Firebase -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getFirestore, collection, addDoc, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        // Configuração exata extraída do seu console do Firebase
        const firebaseConfig = {
            apiKey: "AIzaSyDIY1qa9sWjI3n58TJ31s0EvF8L-5uui4",
            authDomain: "fiscalizacao-total.firebaseapp.com",
            projectId: "fiscalizacao-total",
            storageBucket: "fiscalizacao-total.firebasestorage.app",
            messagingSenderId: "916695238680",
            appId: "1:916695238680:web:3dc3eb58d475ace3b9b6d"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        function formatarNomeQualidade(emailOuLogin) {
            if (!emailOuLogin) return "Cristian Besminoff";
            let base = emailOuLogin.split('@')[0];
            let partes = base.split(/[\.\-_]/).filter(Boolean);
            
            if (partes.length >= 2) {
                let p1 = partes[0].charAt(0).toUpperCase() + partes[0].slice(1).toLowerCase();
                let p2 = partes[1].charAt(0).toUpperCase() + partes[1].slice(1).toLowerCase();
                return `${p1} ${p2}`;
            } else if (partes.length === 1) {
                return partes[0].charAt(0).toUpperCase() + partes[0].slice(1).toLowerCase();
            }
            return emailOuLogin;
        }

        // Recuperação dos dados da URL / LocalStorage
        const params = new URLSearchParams(window.location.search);
        let protocoloID = params.get('protocolo') || 'PRT-998822';
        let tecnicoExecutorUrl = params.get('tecnico') || 'Não informado';
        let enderecoCliente = params.get('endereco') || 'Endereço não informado';

        const dadosSalvos = localStorage.getItem('protocoloEmAtendimento');
        if (dadosSalvos) {
            try {
                let parsed = JSON.parse(dadosSalvos);
                if (parsed.protocolo) protocoloID = parsed.protocolo;
                if (parsed.tecnico) tecnicoExecutorUrl = parsed.tecnico;
                if (parsed.endereco) enderecoCliente = parsed.endereco;
            } catch (e) {
                console.error("Erro ao ler localStorage", e);
            }
        }

        let emailLoginSalvo = params.get('email') || params.get('login') || localStorage.getItem('usuarioEmail') || 'cristian.besminoff';
        const tecnicoQualidadeFormatado = formatarNomeQualidade(emailLoginSalvo);

        // Inserção na tela
        document.getElementById('txt-tecnico-qualidade').innerText = tecnicoQualidadeFormatado;
        document.getElementById('txt-protocolo').innerText = protocoloID;
        document.getElementById('txt-tecnico-executor').innerText = tecnicoExecutorUrl;
        document.getElementById('txt-endereco-cliente').innerText = enderecoCliente;

        // Função do Botão GPS para abrir o Google Maps
        window.abrirGPS = function() {
            if (enderecoCliente && enderecoCliente !== 'Endereço não informado') {
                window.open(`https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(enderecoCliente)}`, '_blank');
            } else {
                alert("Endereço não disponível para navegação.");
            }
        }

        // Função para alternar caixas de edição condicional (Protocolo e Executor)
        window.controlarEdicao = function(tipo) {
            const selectVal = document.getElementById(`valida-${tipo}`).value;
            const boxEdicao = document.getElementById(`box-edicao-${tipo}`);
            if (selectVal === 'nao') {
                boxEdicao.style.display = 'block';
            } else {
                boxEdicao.style.display = 'none';
                document.getElementById(`input-${tipo}-custom`).value = '';
            }
        }

        // Função para seções condicionais baseadas em "Se aplica? (Sim / Não)"
        window.controlarSecao = function(nome) {
            const selectAplica = document.getElementById(`aplica-${nome}`);
            const blocoConteudo = document.getElementById(`conteudo-${nome}`);
            if (selectAplica.value === 'Sim') {
                blocoConteudo.style.display = 'block';
            } else {
                blocoConteudo.style.display = 'none';
            }
        }

        async function fileToBase64(file) {
            return new Promise((resolve, reject) => {
                const reader = new FileReader();
                reader.readAsDataURL(file);
                reader.onload = () => resolve(reader.result);
                reader.onerror = error => reject(error);
            });
        }

        async function filesArrayToBase64(fileList) {
            if (!fileList || fileList.length === 0) return null;
            let arr = [];
            for (let i = 0; i < fileList.length; i++) {
                let b64 = await fileToBase64(fileList[i]);
                arr.push(b64);
            }
            return arr;
        }

        window.enviarVistoria = async function(event) {
            event.preventDefault();
            const btn = document.getElementById('btn-enviar');
            btn.innerText = "Salva no Firebase e Limpar Fila...";
            btn.disabled = true;

            try {
                const protocoloFinal = document.getElementById('valida-protocolo').value === 'nao' 
                    ? (document.getElementById('input-protocolo-custom').value || protocoloID) 
                    : protocoloID;

                const executorFinal = document.getElementById('valida-executor').value === 'nao' 
                    ? (document.getElementById('input-executor-custom').value || tecnicoExecutorUrl) 
                    : tecnicoExecutorUrl;

                const aplicaCaixa = document.getElementById('aplica-caixa').value;
                const aplicaDrop = document.getElementById('aplica-drop').value;
                const aplicaRoldana = document.getElementById('aplica-roldana').value;
                const aplicaPimentao = document.getElementById('aplica-pimentao').value;
                const aplicaAcabamento = document.getElementById('aplica-acabamento').value;
                const aplicaDg = document.getElementById('aplica-dg').value;

                const fExt = aplicaCaixa === 'Sim' ? document.getElementById('foto-caixa-ext')?.files[0] : null;
                const fInt = aplicaCaixa === 'Sim' ? document.getElementById('foto-caixa-int')?.files[0] : null;
                const fDrop = aplicaDrop === 'Sim' ? document.getElementById('foto-lanc-drop')?.files[0] : null;
                const fRoldana = aplicaRoldana === 'Sim' ? document.getElementById('foto-ancoragem-roldana')?.files : null;
                const fPimentao = aplicaPimentao === 'Sim' ? document.getElementById('foto-ancoragem-pimentao')?.files[0] : null;
                const fAcabamento = aplicaAcabamento === 'Sim' ? document.getElementById('foto-acabamento-drop')?.files : null;
                const fDg = aplicaDg === 'Sim' ? document.getElementById('foto-organizacao-dg')?.files[0] : null;
                
                const dadosVistoria = {
                    tecnicoQualidade: tecnicoQualidadeFormatado,
                    estado: document.getElementById('estado').value,
                    cidade: document.getElementById('cidade').value,
                    protocolo: protocoloFinal,
                    endereco: enderecoCliente,
                    empresaFiscalizada: document.getElementById('empresa').value,
                    tecnicoExecutor: executorFinal,
                    tipoVistoria: document.getElementById('tipo-vistoria').value,
                    apr: document.getElementById('apr').value,
                    
                    aplicaCaixa: aplicaCaixa,
                    orgCa: aplicaCaixa === 'Sim' ? document.getElementById('org-ca').value : 'N/A',
                    
                    aplicaDrop: aplicaDrop,
                    lancDrop: aplicaDrop === 'Sim' ? document.getElementById('lanc-drop').value : 'N/A',
                    
                    aplicaRoldana: aplicaRoldana,
                    ancoragemRoldana: aplicaRoldana === 'Sim' ? document.getElementById('ancoragem-roldana').value : 'N/A',
                    
                    aplicaPimentao: aplicaPimentao,
                    ancoragemPimentao: aplicaPimentao === 'Sim' ? document.getElementById('ancoragem-pimentao').value : 'N/A',
                    
                    aplicaAcabamento: aplicaAcabamento,
                    acabamentoDrop: aplicaAcabamento === 'Sim' ? document.getElementById('acabamento-drop').value : 'N/A',
                    
                    aplicaDg: aplicaDg,
                    organizacaoDg: aplicaDg === 'Sim' ? document.getElementById('organizacao-dg').value : 'N/A',

                    statusFinal: document.querySelector('input[name="status"]:checked').value,
                    observacoes: document.getElementById('observacoes').value,
                    dataHora: new Date().toISOString(),
                    criadoEm: serverTimestamp(),

                    fotoCaixaExt: fExt ? await fileToBase64(fExt) : null,
                    fotoCaixaInt: fInt ? await fileToBase64(fInt) : null,
                    fotoLancDrop: fDrop ? await fileToBase64(fDrop) : null,
                    fotoAncoragemRoldana: await filesArrayToBase64(fRoldana),
                    fotoAncoragemPimentao: fPimentao ? await fileToBase64(fPimentao) : null,
                    fotoAcabamentoDrop: await filesArrayToBase64(fAcabamento),
                    fotoOrganizacaoDg: fDg ? await fileToBase64(fDg) : null
                };

                // Salva no banco Firestore na coleção 'vistorias'
                await addDoc(collection(db, "vistorias"), dadosVistoria);

                alert("Fiscalização salva com sucesso no Firebase! O protocolo foi processado.");
                
                localStorage.removeItem('protocoloEmAtendimento');
                window.location.href = "index.html"; 
            } catch (e) {
                console.error("Erro ao salvar no Firebase: ", e);
                alert("Erro ao salvar os dados no Firebase. Verifique a conexão e tente novamente.");
                btn.innerText = "Salvar Fiscalização e Limpar Fila";
                btn.disabled = false;
            }
        }
    </script>
</body>
</html>
