<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fiscalização Total - Unifique</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { background-color: #0f172a; color: #f8fafc; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        .glass { background: rgba(30, 41, 59, 0.7); backdrop-filter: blur(12px); border: 1px solid rgba(255, 255, 255, 0.1); }
    </style>
</head>
<body class="min-h-screen flex flex-col items-center justify-center p-4">

    <!-- Container Principal de Login -->
    <div class="w-full max-w-md glass rounded-2xl shadow-2xl p-8 border border-slate-700">
        
        <div class="text-center mb-8">
            <h1 class="text-3xl font-extrabold text-cyan-400 tracking-wider">FISCALIZAÇÃO TOTAL</h1>
            <p class="text-xs text-slate-400 mt-1">Plataforma Operacional de Qualidade - Unifique</p>
        </div>

        <form onsubmit="realizarLogin(event)" class="space-y-5">
            <div>
                <label class="block text-xs font-semibold text-slate-300 mb-2 uppercase tracking-wide">E-mail Corporativo:</label>
                <input type="email" id="email" required placeholder="seu.email@redeunifique.com.br" class="w-full bg-slate-900 border border-slate-700 rounded-xl p-3 text-white text-sm focus:outline-none focus:border-cyan-500">
            </div>

            <div>
                <label class="block text-xs font-semibold text-slate-300 mb-2 uppercase tracking-wide">Senha:</label>
                <input type="password" id="senha" required placeholder="••••••••" class="w-full bg-slate-900 border border-slate-700 rounded-xl p-3 text-white text-sm focus:outline-none focus:border-cyan-500">
            </div>

            <button type="submit" id="btn-entrar" class="w-full py-4 bg-gradient-to-r from-cyan-600 to-blue-600 hover:from-cyan-500 hover:to-blue-500 text-white font-bold rounded-xl shadow-lg transition transform active:scale-95 text-sm uppercase tracking-wider">
                Acessar Sistema
            </button>
        </form>

        <div class="mt-3">
            <a href="https://cristianbesminoff-hue.github.io/VistoriaFTTA/" target="_blank" class="w-full block text-center py-3 bg-slate-800 hover:bg-slate-700 text-cyan-400 font-bold rounded-xl border border-cyan-500/30 transition text-sm uppercase tracking-wider">
                Fiscalização FTTA
            </a>
        </div>

        <div id="msg-erro" class="mt-4 text-center text-xs text-rose-400 font-semibold hidden"></div>
    </div>

    <!-- Rodapé com Direitos Autorais -->
    <footer class="mt-8 text-center text-xs text-slate-500 space-y-1">
        <p>Criado e Desenvolvido por <span class="text-cyan-400 font-semibold">Cristian Azevedo Besminoff</span></p>
        <p class="text-[11px] text-slate-400 font-medium">© 2026 • Todos os direitos reservados</p>
        <p class="text-[10px] text-slate-600">Unifique Telecomunicações</p>
    </footer>

    <!-- Script de Autenticação Integrado ao Firebase -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getFirestore, collection, getDocs, query, where } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyDIY1qa9sWjI3n58TJ31s0EvF8L-5uui4",
            authDomain: "fiscalizacao-total.firebaseapp.com",
            projectId: "fiscalizacao-total",
            storageBucket: "fiscalizacao-total.firebasestorage.app",
            messagingSenderId: "916695238680",
            appId: "1:916695238680:web:3dc3eb58d475ace3b9b6d"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        window.realizarLogin = async function(event) {
            event.preventDefault();
            
            const email = document.getElementById('email').value.trim().toLowerCase();
            const senha = document.getElementById('senha').value.trim();
            const msgErro = document.getElementById('msg-erro');
            const btnEntrar = document.getElementById('btn-entrar');

            msgErro.classList.add('hidden');
            btnEntrar.disabled = true;
            btnEntrar.textContent = "Verificando...";

            try {
                const q = query(collection(db, "usuarios_sistema"), where("email", "==", email));
                const querySnapshot = await getDocs(q);

                if (querySnapshot.empty) {
                    msgErro.innerText = "E-mail não cadastrado ou sem acesso.";
                    msgErro.classList.remove('hidden');
                    btnEntrar.disabled = false;
                    btnEntrar.textContent = "Acessar Sistema";
                    return;
                }

                let usuarioData = null;
                querySnapshot.forEach((doc) => {
                    usuarioData = doc.data();
                });

                if (usuarioData.status === "pausado") {
                    msgErro.innerText = "Acesso temporariamente pausado (Férias/Afastamento). Contate o gestor.";
                    msgErro.classList.remove('hidden');
                    btnEntrar.disabled = false;
                    btnEntrar.textContent = "Acessar Sistema";
                    return;
                }

                if (usuarioData.senha !== senha) {
                    msgErro.innerText = "Senha incorreta.";
                    msgErro.classList.remove('hidden');
                    btnEntrar.disabled = false;
                    btnEntrar.textContent = "Acessar Sistema";
                    return;
                }

                // Salva o e-mail no navegador para persistir a sessão nas outras telas
                localStorage.setItem('usuarioEmail', email);

                if (usuarioData.perfil === "gestor") {
                    alert("Acesso autorizado: Painel do Gestor.");
                    window.location.href = `gestor.html?email=${encodeURIComponent(email)}`;
                } else {
                    alert("Acesso autorizado: Módulo Extrator.");
                    window.location.href = `extrator.html?email=${encodeURIComponent(email)}`;
                }

            } catch (e) {
                console.error("Erro detalhado no login:", e);
                msgErro.innerText = "Erro ao conectar: " + e.message;
                msgErro.classList.remove('hidden');
                btnEntrar.disabled = false;
                btnEntrar.textContent = "Acessar Sistema";
            }
        }
    </script>
</body>
</html>
